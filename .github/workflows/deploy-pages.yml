# Test deployment to GitHub Pages (static export).
#
# GitHub Pages only serves static files, so this build excludes the
# /api/contact route: the contact form shows its "not connected" notice and
# an email fallback. For working inquiry delivery, deploy the default build
# to a Node host such as Vercel (see README → Deployment).
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-maxwell-7o8ldw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Test deployment — keep it out of search engines.
          NEXT_PUBLIC_NOINDEX: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
