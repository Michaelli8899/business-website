# Builds the React (Vite) site, prerenders every route to static HTML, and
# deploys it to GitHub Pages.
#
# One-time setup:
#   - Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   - Deploys run from `main` (the github-pages environment only accepts the
#     default branch). Work happens on feature branches and is merged to deploy.
#
# Optional build settings (Settings → Secrets and variables → Actions →
# Variables): VITE_CONTACT_ENDPOINT, VITE_LINKEDIN_URL, VITE_INSTAGRAM_URL,
# VITE_GITHUB_URL, VITE_BOOKING_URL, VITE_PRIVACY_LAST_UPDATED,
# VITE_PRIVACY_REVIEWED. These are public build-time values — never put API
# keys here; the Resend key belongs on the contact function's host.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build and prerender
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Test deployment — keep it out of search engines.
          VITE_NOINDEX: "true"
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL }}
          VITE_INSTAGRAM_URL: ${{ vars.VITE_INSTAGRAM_URL }}
          VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL }}
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_PRIVACY_LAST_UPDATED: ${{ vars.VITE_PRIVACY_LAST_UPDATED }}
          VITE_PRIVACY_REVIEWED: ${{ vars.VITE_PRIVACY_REVIEWED }}

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
